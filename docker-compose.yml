version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: offline_latex_generator_prod
    ports:
      - "5000:5000"
    volumes:
      - models_volume:/app/models
    environment:
      - OLG_ENV=production
      - WORKSPACE_ROOT=/tmp/workspaces
    restart: unless-stopped

volumes:
  models_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./models
